name: Keep API Alive

on:
  schedule:
    - cron: "*/5 8-23,0-1 * * *"
    - cron: "*/15 2-7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check (GET /health)
        run: |
          curl -fsS --retry 2 --max-time 10 https://api.dosyahub.com/health > /dev/null
